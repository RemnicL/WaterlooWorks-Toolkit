<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaterlooWorks Folder Importer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Folder Importer</h1>

    <section>
      <h2>选择分类 JSON</h2>
      <p>文件夹名称必须与 WaterlooWorks 中的名称完全一致。</p>
      <label for="planFile">JSON 文件</label>
      <input id="planFile" type="file" accept=".json,application/json">
      <button id="runButton" type="button" disabled>读取映射并放入文件夹</button>
      <button id="removeButton" class="danger" type="button" disabled>将所有工作移出当前文件夹</button>
    </section>

    <section>
      <h2>清理已申请岗位</h2>
      <p>检查所有 My Jobs 文件夹，移出已申请的岗位。无需 JSON。</p>
      <button id="removeAppliedButton" class="danger" type="button">从文件夹移出已申请岗位</button>
    </section>

    <section>
      <h2>计划与结果</h2>
      <pre id="output">等待操作。</pre>
    </section>
  </main>

  <script src="folder-plan.js"></script>
  <script src="popup.js"></script>
</body>
</html>
