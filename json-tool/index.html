<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaterlooWorks JSON 工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <header>
      <p class="eyebrow">WaterlooWorks JSON 工具</p>
      <h1>处理工作 JSON</h1>
      <p>数据只在当前浏览器中处理，不会上传。</p>
    </header>

    <section class="tool" aria-labelledby="split-title">
      <h2 id="split-title">分割文件</h2>
      <label class="file-picker">
        <span>JSON 文件</span>
        <input id="json-file" type="file" accept="application/json,.json">
      </label>

      <dl class="summary" aria-live="polite">
        <div>
          <dt>当前文件</dt>
          <dd id="file-name">尚未选择</dd>
        </div>
        <div>
          <dt>工作数量</dt>
          <dd id="job-count">—</dd>
        </div>
        <div>
          <dt>预计生成</dt>
          <dd id="part-count">—</dd>
        </div>
      </dl>

      <label class="field">
        <span>每个文件的工作数量</span>
        <input id="chunk-size" type="number" min="1" step="1" value="20" inputmode="numeric">
      </label>

      <button id="split-button" type="button" disabled>分割并下载</button>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="tool" aria-labelledby="merge-title">
      <h2 id="merge-title">合并文件</h2>
      <p class="section-description">按照文件中的 <code>posting_ids</code> 顺序合并；重复 ID 保留第一次出现的工作。</p>
      <label class="file-picker">
        <span>JSON 文件（至少两个）</span>
        <input id="merge-files" type="file" accept="application/json,.json" multiple>
      </label>

      <dl class="summary" aria-live="polite">
        <div><dt>文件数量</dt><dd id="merge-file-count">—</dd></div>
        <div><dt>合并前条目</dt><dd id="merge-input-count">—</dd></div>
        <div><dt>合并后工作</dt><dd id="merge-output-count">—</dd></div>
      </dl>

      <button id="merge-button" type="button" disabled>合并并下载</button>
      <p id="merge-status" class="status" role="status"></p>
    </section>

    <section class="tool" aria-labelledby="delete-title">
      <h2 id="delete-title">筛选并批量删除</h2>
      <p class="section-description">查找包含指定文本的工作，并下载删除这些工作后的新文件。搜索不区分大小写。</p>
      <label class="file-picker">
        <span>JSON 文件</span>
        <input id="delete-file" type="file" accept="application/json,.json">
      </label>

      <div class="rule-fields">
        <label class="field">
          <span>查找范围</span>
          <select id="delete-field">
            <option value="all">全部工作内容</option>
            <option value="posting_id">工作 ID</option>
            <option value="title">职位名称</option>
            <option value="organization">公司名称</option>
            <option value="division">部门</option>
            <option value="city">城市</option>
            <option value="raw_text">原始文本</option>
          </select>
        </label>
        <label class="field">
          <span>要查找的文本</span>
          <input id="delete-query" type="text" placeholder="例如：Toronto">
        </label>
      </div>

      <dl class="summary" aria-live="polite">
        <div><dt>原工作数量</dt><dd id="delete-input-count">—</dd></div>
        <div><dt>将删除</dt><dd id="delete-match-count">—</dd></div>
        <div><dt>删除后剩余</dt><dd id="delete-output-count">—</dd></div>
      </dl>

      <button id="delete-button" type="button" disabled>删除匹配项并下载</button>
      <p id="delete-status" class="status" role="status"></p>
    </section>
  </main>

  <script src="splitter-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
