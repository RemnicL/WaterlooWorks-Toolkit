<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaterlooWorks JSON 工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <header>
      <p class="eyebrow">WaterlooWorks JSON 工具</p>
      <h1>处理工作 JSON</h1>
      <p>数据只在当前浏览器中处理，不会上传。</p>
    </header>

    <section class="tool" aria-labelledby="split-title">
      <h2 id="split-title">分割文件</h2>
      <label class="file-picker">
        <span>JSON 文件</span>
        <input id="json-file" type="file" accept="application/json,.json">
      </label>

      <dl class="summary" aria-live="polite">
        <div>
          <dt>当前文件</dt>
          <dd id="file-name">尚未选择</dd>
        </div>
        <div>
          <dt>工作数量</dt>
          <dd id="job-count">—</dd>
        </div>
        <div>
          <dt>预计生成</dt>
          <dd id="part-count">—</dd>
        </div>
      </dl>

      <label class="field">
        <span>每个文件的工作数量</span>
        <input id="chunk-size" type="number" min="1" step="1" value="20" inputmode="numeric">
      </label>

      <button id="split-button" type="button" disabled>分割并下载</button>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="tool" aria-labelledby="merge-title">
      <h2 id="merge-title">合并文件</h2>
      <p class="section-description">按照文件中的 <code>posting_ids</code> 顺序合并；重复 ID 保留第一次出现的工作。</p>
      <label class="file-picker">
        <span>JSON 文件（至少两个）</span>
        <input id="merge-files" type="file" accept="application/json,.json" multiple>
      </label>

      <dl class="summary" aria-live="polite">
        <div><dt>文件数量</dt><dd id="merge-file-count">—</dd></div>
        <div><dt>合并前条目</dt><dd id="merge-input-count">—</dd></div>
        <div><dt>合并后工作</dt><dd id="merge-output-count">—</dd></div>
      </dl>

      <button id="merge-button" type="button" disabled>合并并下载</button>
      <p id="merge-status" class="status" role="status"></p>
    </section>

    <p class="future-note">后续功能（按规则筛选与批量删除）将复用同一套 JSON 校验与数据处理模块。</p>
  </main>

  <script src="splitter-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
